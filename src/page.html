<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Foundry Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #e9ecf8;
  --ink-2: rgba(233, 236, 248, .72);
  --ink-3: rgba(233, 236, 248, .46);
  --ink-4: rgba(233, 236, 248, .22);
  --line: rgba(233, 236, 248, .10);
  --ground: #060a18;
  --blue: #3b82f6;
  --blue-deep: #1d4ed8;
  --indigo: #6366f1;
  --violet: #8b5cf6;
  --amber: #f5b14c;
  --coral: #ff7a6b;
  --green: #3dd68c;
  --glass: rgba(14, 20, 42, .42);
  --serif: "DM Serif Display", Georgia, serif;
  --sans: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  /* keep clear of the menu bar and the Dock */
  --safe-top: max(56px, 6vh);
  --safe-bottom: max(96px, 11vh);
  --safe-side: max(48px, 4vw);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  cursor: default;
  user-select: none;
}

/* ---------- the sky ---------- */
.sky { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
.blob {
  position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; mix-blend-mode: screen;
  will-change: transform;
}
.b1 { width: 62vmax; height: 62vmax; left: -18vmax; top: -22vmax; background: radial-gradient(circle at 40% 40%, var(--blue-deep), transparent 65%); animation: drift1 95s ease-in-out infinite alternate; }
.b2 { width: 54vmax; height: 54vmax; right: -16vmax; top: 8vmax; background: radial-gradient(circle at 50% 50%, var(--indigo), transparent 62%); animation: drift2 120s ease-in-out infinite alternate; opacity: .45; }
.b3 { width: 48vmax; height: 48vmax; left: 22vmax; bottom: -26vmax; background: radial-gradient(circle at 50% 50%, var(--violet), transparent 60%); animation: drift3 140s ease-in-out infinite alternate; opacity: .35; }
.b4 { width: 30vmax; height: 30vmax; right: 18vmax; bottom: -8vmax; background: radial-gradient(circle, #0ea5e9, transparent 60%); animation: drift1 160s ease-in-out infinite alternate-reverse; opacity: .22; }
@keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.12); } }
@keyframes drift2 { to { transform: translate(-12vmax, 12vmax) scale(.9); } }
@keyframes drift3 { to { transform: translate(-16vmax, -10vmax) scale(1.15); } }
.grid {
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(233,236,248,.09) 1px, transparent 1.2px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at 38% 50%, #000 0%, transparent 72%);
}
.grain {
  position: absolute; inset: -50%; opacity: .07; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(3,5,12,.7) 100%); }

/* ---------- layout ---------- */
.stage {
  position: relative; z-index: 1; height: 100%;
  padding: var(--safe-top) var(--safe-side) var(--safe-bottom);
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr);
  grid-template-rows: minmax(0, 1fr);
  gap: clamp(32px, 5vw, 96px);
  align-items: center;
}
@media (max-aspect-ratio: 1/1) {
  .stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: start; }
}

/* ---------- the dial ---------- */
.dialWrap { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.4vh, 28px); height: 100%; min-height: 0; }
.dialBox { position: relative; width: min(100%, calc(100vh - var(--safe-top) - var(--safe-bottom) - clamp(160px, 19vh, 230px))); aspect-ratio: 1; flex: none; }
.dial { width: 100%; height: 100%; overflow: visible; display: block; }
.weekCard { width: min(100%, 900px); flex: none; }
.dial text { font-family: var(--mono); fill: var(--ink-3); font-size: 11px; letter-spacing: .14em; }
.centre {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none;
}
.centre-inner { width: 52%; }
.eyebrow { font-family: var(--mono); font-size: clamp(10px, .8vw, 13px); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); }
.day { font-family: var(--serif); font-size: clamp(96px, 17vh, 240px); line-height: .82; letter-spacing: -.02em; margin-top: .1em;
  background: linear-gradient(180deg, #fff 30%, rgba(190,205,255,.75)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.month { font-family: var(--serif); font-style: italic; font-size: clamp(22px, 3.4vh, 44px); color: var(--ink-2); margin-top: .1em; }
.clocks { display: flex; justify-content: center; gap: clamp(18px, 2.4vw, 40px); margin-top: clamp(12px, 2vh, 22px); }
.clk { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.clk .lbl { font-family: var(--mono); font-size: clamp(10px, .75vw, 12px); letter-spacing: .2em; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.clk .lbl i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.clk .val { font-family: var(--mono); font-weight: 500; font-size: clamp(24px, 3.6vh, 46px); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clk.pk .val { color: var(--ink-2); }
.clk .colon { opacity: .5; animation: blink 2s steps(1) infinite; }
.clk .off { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--ink-4); }
@keyframes blink { 50% { opacity: .15; } }
.next { margin-top: clamp(18px, 3vh, 36px); padding-top: clamp(14px, 2vh, 24px); border-top: 1px solid var(--line); }
.next-title { font-size: clamp(15px, 1.9vh, 22px); font-weight: 500; margin-top: 8px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.next-meta { margin-top: 10px; display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.chip {
  font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 6px; border: 1px solid var(--ink-4); color: var(--ink-2);
}
.chip.hot { border-color: rgba(245,177,76,.55); color: var(--amber); background: rgba(245,177,76,.08); }
.chip.live { border-color: rgba(255,122,107,.6); color: var(--coral); background: rgba(255,122,107,.1); }
.chip.ok { border-color: rgba(61,214,140,.5); color: var(--green); background: rgba(61,214,140,.08); }

.nowDot { filter: drop-shadow(0 0 10px rgba(255,255,255,.9)); }
.arc { transition: opacity .6s; }

/* ---------- side instruments ---------- */
.side { display: flex; flex-direction: column; gap: clamp(12px, 1.8vh, 22px); min-width: 0; max-height: 100%; overflow: hidden; }
.card {
  position: relative; border-radius: 16px; overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015)), var(--glass);
  border: 1px solid rgba(233,236,248,.09);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 30px 80px -40px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);
}
.card-head {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; white-space: nowrap;
  height: 36px; padding: 0 16px; border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3);
}
.card-body { padding: 16px; }
.card-head span:first-child { flex: none; }
.card-head span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 2000px) { .side { zoom: 1.25; } }
@media (min-width: 2800px) { .side { zoom: 1.5; } }
.big { font-family: var(--serif); font-size: clamp(44px, 6.4vh, 84px); line-height: .9; }
.big small { font-family: var(--sans); font-size: 13px; color: var(--ink-3); margin-left: 8px; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 7px 0; }
.row + .row { border-top: 1px solid rgba(233,236,248,.05); }
.avatar {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; color: #0b1020;
}
.row-text { min-width: 0; flex: 1; }
.row-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 500; }
.row-top .when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 400; flex: none; }
.row-sub { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.discreet .private { filter: blur(6px); }

.inbox-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 44px; }
.counts { display: flex; gap: clamp(18px, 2vw, 32px); align-items: flex-end; }
.src { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--ink-4); border-radius: 4px; padding: 1px 5px; flex: none; }
.src.slack { color: #e8a8ff; border-color: rgba(232,168,255,.35); }
.src.draft { color: var(--green); border-color: rgba(61,214,140,.45); background: rgba(61,214,140,.08); }
.row-top .name { display: flex; gap: 7px; align-items: center; min-width: 0; }
.note { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
.note a { color: var(--ink-2); }
.bars span { width: 6px; border-radius: 3px; background: linear-gradient(180deg, var(--blue), var(--indigo)); opacity: .85; }

.promise { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.promise + .promise { border-top: 1px solid rgba(233,236,248,.05); }
.ring { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink-3); margin-top: 3px; }
.ring.overdue { border-color: var(--coral); box-shadow: 0 0 10px rgba(255,122,107,.6); }
.ring.today { border-color: var(--amber); }
.promise .t { font-size: 13.5px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.promise .m { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.promise .m.overdue { color: var(--coral); }

.systems { display: flex; gap: 16px; align-items: center; }
.sys-top { display: flex; gap: 14px; align-items: center; flex: none; }
.constellation { flex: none; width: 52px; height: 52px; }
.systems .sys-sub { margin-top: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-body.slim { padding: 12px 16px; }
.side > * { flex-shrink: 0; }
@media (max-width: 1440px) { .card-head { letter-spacing: .12em; padding: 0 12px; } .card-body { padding: 12px; } }
@media (max-height: 860px) { .big { font-size: 40px; } .inbox-top { margin-bottom: 4px; } .bars { height: 30px; } .row { padding: 5px 0; } .promise { padding: 6px 0; } }
.sys-head { font-family: var(--serif); font-size: clamp(19px, 2.3vh, 26px); line-height: 1.1; white-space: nowrap; }
.sys-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.45; }

.strip-labels { position: relative; height: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.strip-labels span { position: absolute; transform: translateX(-50%); }
.strip-labels span:first-child { transform: none; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { min-width: 0; border-radius: 8px; padding: 6px 6px 8px; background: rgba(255,255,255,.025); border: 1px solid rgba(233,236,248,.05); display: flex; flex-direction: column; gap: 4px; }
.wd.today { background: rgba(59,130,246,.12); border-color: rgba(96,165,250,.35); }
.wd .dn { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; gap: 4px; }
.wd.today .dn { color: var(--ink); }
.wd .mt { display: flex; gap: 2px; height: 4px; }
.wd .mt i { flex: 1; border-radius: 2px; background: #60a5fa; opacity: .7; }
.wd .mt i.ext { background: #f5b14c; }
.task { font-size: 11px; line-height: 1.3; padding: 3px 5px; border-radius: 4px; background: rgba(139,92,246,.16); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task.rec::before { content: "↻ "; color: #c4b5fd; }
.task.late { background: rgba(255,122,107,.16); color: #ffb3aa; }
.more { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.sugg { display: flex; flex-direction: column; gap: 4px; padding: 5px 0; }
.sugg .t { font-size: 13px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.sugg .m { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.sugg .acts { flex: none; }
.sugg + .sugg { border-top: 1px solid rgba(233,236,248,.05); }
.sugg .acts { display: flex; gap: 6px; }
.btn { font: 600 11px var(--sans); letter-spacing: .02em; border-radius: 6px; padding: 4px 9px; cursor: pointer; border: 1px solid var(--ink-4); background: transparent; color: var(--ink-2); }
.btn.yes { border-color: rgba(61,214,140,.5); color: var(--green); background: rgba(61,214,140,.08); }
.btn.no:hover { color: var(--coral); border-color: rgba(255,122,107,.5); }
.btn:disabled { opacity: .5; cursor: default; }
.review-link { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-decoration: none; }
.empty { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.empty a { color: var(--ink); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 2.2vh, 26px); }
@media (max-height: 1050px) { .hide-short { display: none; } }

.foot {
  position: fixed; z-index: 1; left: var(--safe-side); bottom: calc(var(--safe-bottom) - 40px);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-4);
  display: flex; gap: 14px;
}
.foot .warn { color: var(--amber); }

@media (prefers-reduced-motion: reduce) {
  .blob, .clk .colon { animation: none !important; }
}
.still .blob, .still .clk .colon { animation: none !important; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="grid"></div><div class="grain"></div><div class="vignette"></div>
</div>

<main class="stage">
  <section class="dialWrap">
    <div class="dialBox">
    <svg class="dial" id="dial" viewBox="0 0 1000 1000" aria-label="Today"></svg>
    <div class="centre">
      <div class="centre-inner">
        <div class="eyebrow" id="weekday">—</div>
        <div class="day" id="day">—</div>
        <div class="month" id="month">—</div>
        <div class="clocks" id="clocks"></div>
        <div class="next" id="next"></div>
      </div>
    </div>
    </div>
    <div class="card weekCard">
      <div class="card-head"><span>05 // Next 7 days</span><span id="weekState"></span></div>
      <div class="card-body slim" id="week"><div class="empty">—</div></div>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="card-head"><span>01 // Inbox</span><span id="mailState"></span></div>
      <div class="card-body" id="mail"><div class="empty">Reading Gmail and Slack…</div></div>
    </div>
    <div class="split">
      <div class="card">
        <div class="card-head"><span>02 // Promised</span><span id="promState"></span></div>
        <div class="card-body" id="promised"><div class="empty">Reading Foundry…</div></div>
      </div>
      <div class="card">
        <div class="card-head"><span>03 // Suggested replies</span><span id="draftState"></span></div>
        <div class="card-body" id="drafts"><div class="empty">—</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span>04 // Systems</span><span id="sysState"></span></div>
      <div class="card-body slim" id="systems"><div class="empty">Reading Foundry…</div></div>
    </div>
  </aside>
</main>

<div class="foot" aria-hidden="true"><span>Foundry · Gitwork</span><span id="fresh"></span></div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var KEY = params.get("k") || "";
  if (params.get("discreet") === "1") document.body.classList.add("discreet");
  if (params.get("still") === "1") document.body.classList.add("still");

  var NS = "http://www.w3.org/2000/svg";
  var C = 500, R_TICK = 452, R_ARC = 404, R_ARC_W = 34, R_NIGHT = 452;
  var data = null;

  // ---------- helpers ----------
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function h(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function dayKey(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
  function hourOf(d) { return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
  function angle(hours) { return (hours / 24) * Math.PI * 2 + Math.PI / 2; } // noon at the top, midnight at the bottom
  function pt(r, hours) { var a = angle(hours); return [C + r * Math.cos(a), C + r * Math.sin(a)]; }
  function arcPath(r, h0, h1) {
    var a = pt(r, h0), b = pt(r, h1), large = (h1 - h0) > 12 ? 1 : 0;
    return "M" + a[0] + " " + a[1] + " A" + r + " " + r + " 0 " + large + " 1 " + b[0] + " " + b[1];
  }
  function hue(str) { var x = 0; for (var i = 0; i < str.length; i++) x = (x * 31 + str.charCodeAt(i)) % 360; return x; }
  function relMins(ms) {
    var m = Math.round(ms / 60000);
    if (m < 1) return "now";
    if (m < 60) return m + " min";
    var hrs = Math.floor(m / 60), rest = m % 60;
    return hrs + "h" + (rest ? " " + pad(rest) : "");
  }
  function ago(iso) {
    var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 60) return Math.max(m, 1) + "m";
    if (m < 1440) return Math.round(m / 60) + "h";
    return Math.round(m / 1440) + "d";
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function reasonText(src, r) {
    if (r === "not_connected" || r === "reconnect") return { text: (r === "reconnect" ? "Google needs reconnecting. " : "Google isn't connected yet. "), link: "/connect?k=" + encodeURIComponent(KEY), linkText: "Connect Google" };
    if (r === "not_connected_slack" || r === "reconnect_slack") return { text: (r === "reconnect_slack" ? "Slack needs reconnecting. " : "Slack isn't connected yet. "), link: "/connect-slack?k=" + encodeURIComponent(KEY), linkText: "Connect Slack" };
    if (r === "rate_limited") return { text: src + " asked us to slow down; trying again shortly." };
    if (r === "not_configured") return { text: "Add a Foundry API key to show this." };
    if (r === "no_access") return { text: "Couldn't read " + src + ": access was refused." };
    return { text: "Couldn't reach " + src + " just now. Showing nothing rather than guessing." };
  }
  function emptyMsg(target, src, r) {
    clear(target);
    var info = reasonText(src, r);
    var p = h("div", "empty", info.text);
    if (info.link) { var a = h("a", null, info.linkText); a.href = info.link; p.appendChild(a); }
    target.appendChild(p);
  }

  // ---------- clock ----------
  // Clock times are always 24-hour. "Here" is the Mac's own zone (UK); Pakistan is fixed.
  var PK_TZ = "Asia/Karachi";
  function zoned(tz, d) {
    var parts = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d);
    var get = function (t) { return Number((parts.find(function (p) { return p.type === t; }) || {}).value || 0); };
    return { h: get("hour"), m: get("minute") };
  }
  function offsetHours(tz, d) {
    var here = d.getHours() * 60 + d.getMinutes(), there = zoned(tz, d), diff = there.h * 60 + there.m - here;
    if (diff > 720) diff -= 1440; if (diff < -720) diff += 1440;
    var hrs = diff / 60;
    return (hrs >= 0 ? "+" : "") + (Number.isInteger(hrs) ? hrs : hrs.toFixed(1)) + "H";
  }
  function hereLabel() {
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    if (tz === "Europe/London") return "UK";
    var city = tz.split("/").pop() || "Here";
    return city.replace(/_/g, " ").toUpperCase();
  }
  function clockEl(label, colour, hh, mm, extra, cls) {
    var c = h("div", "clk" + (cls ? " " + cls : ""));
    var l = h("div", "lbl"); var dot = h("i"); dot.style.background = colour; l.appendChild(dot); l.appendChild(document.createTextNode(label)); c.appendChild(l);
    var v = h("div", "val"); v.appendChild(document.createTextNode(pad(hh))); v.appendChild(h("span", "colon", ":")); v.appendChild(document.createTextNode(pad(mm))); c.appendChild(v);
    if (extra) c.appendChild(h("div", "off", extra));
    return c;
  }
  function renderClock() {
    var now = new Date();
    document.getElementById("weekday").textContent = now.toLocaleDateString("en-GB", { weekday: "long" }) + " · W" + isoWeek(now);
    document.getElementById("day").textContent = String(now.getDate());
    document.getElementById("month").textContent = now.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    var box = document.getElementById("clocks"); clear(box);
    box.appendChild(clockEl(hereLabel(), "#ffffff", now.getHours(), now.getMinutes(), null));
    var pk = zoned(PK_TZ, now);
    box.appendChild(clockEl("PAKISTAN", "#3dd68c", pk.h, pk.m, offsetHours(PK_TZ, now), "pk"));
  }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y) / 86400000 + 1) / 7);
  }

  // ---------- dial ----------
  function todaysEvents() {
    if (!data || !data.calendar || !data.calendar.ok) return [];
    var key = dayKey(new Date());
    return data.calendar.events.filter(function (e) { return !e.allDay && dayKey(new Date(e.start)) === key; });
  }
  function renderDial() {
    var svg = document.getElementById("dial");
    clear(svg);
    var now = new Date(), nowH = hourOf(now);

    var defs = el("defs", {}, svg);
    var g1 = el("linearGradient", { id: "gInt", x1: "0", y1: "0", x2: "1", y2: "1" }, defs);
    el("stop", { offset: "0", "stop-color": "#60a5fa" }, g1); el("stop", { offset: "1", "stop-color": "#6366f1" }, g1);
    var g2 = el("linearGradient", { id: "gExt", x1: "0", y1: "0", x2: "1", y2: "1" }, defs);
    el("stop", { offset: "0", "stop-color": "#fbbf24" }, g2); el("stop", { offset: "1", "stop-color": "#ff7a6b" }, g2);
    var glow = el("filter", { id: "glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
    el("feGaussianBlur", { stdDeviation: "9", result: "b" }, glow);
    var m = el("feMerge", {}, glow); el("feMergeNode", { in: "b" }, m); el("feMergeNode", { in: "SourceGraphic" }, m);
    var halo = el("radialGradient", { id: "halo" }, defs);
    el("stop", { offset: "0", "stop-color": "#3b82f6", "stop-opacity": ".22" }, halo);
    el("stop", { offset: "1", "stop-color": "#3b82f6", "stop-opacity": "0" }, halo);

    el("circle", { cx: C, cy: C, r: 330, fill: "url(#halo)" }, svg);

    // night band 19:00 → 07:00
    el("path", { d: arcPath(R_NIGHT + 14, 19, 31), fill: "none", stroke: "rgba(99,102,241,.16)", "stroke-width": 10, "stroke-linecap": "round" }, svg);
    // working-day band 09:00 → 17:30
    el("path", { d: arcPath(R_NIGHT + 14, 9, 17.5), fill: "none", stroke: "rgba(96,165,250,.32)", "stroke-width": 10, "stroke-linecap": "round" }, svg);

    // track
    el("circle", { cx: C, cy: C, r: R_ARC, fill: "none", stroke: "rgba(233,236,248,.06)", "stroke-width": R_ARC_W }, svg);
    // elapsed part of the day
    el("path", { d: arcPath(R_ARC, 0, Math.max(nowH, .01)), fill: "none", stroke: "rgba(233,236,248,.05)", "stroke-width": R_ARC_W }, svg);

    // ticks
    for (var i = 0; i < 96; i++) {
      var hh = i / 4, major = i % 4 === 0, a = pt(R_TICK - (major ? 18 : 8), hh), b = pt(R_TICK, hh);
      el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: hh <= nowH ? "rgba(233,236,248,.42)" : "rgba(233,236,248,.16)", "stroke-width": major ? 2 : 1, "stroke-linecap": "round" }, svg);
    }
    [0, 3, 6, 9, 12, 15, 18, 21].forEach(function (hh) {
      var p = pt(R_TICK + 34, hh);
      var t = el("text", { x: p[0], y: p[1] + 4, "text-anchor": "middle" }, svg);
      t.textContent = pad(hh);
    });

    // meetings
    todaysEvents().forEach(function (e) {
      var s = new Date(e.start), en = new Date(e.end);
      var h0 = hourOf(s), h1 = Math.max(hourOf(en), h0 + 0.12);
      if (dayKey(en) !== dayKey(s)) h1 = 23.99;
      var past = en < now, live = s <= now && en > now;
      var path = el("path", {
        d: arcPath(R_ARC, h0 + 0.02, h1 - 0.02), fill: "none",
        stroke: e.external ? "url(#gExt)" : "url(#gInt)", "stroke-width": live ? R_ARC_W + 10 : R_ARC_W - 6,
        "stroke-linecap": "round", class: "arc", opacity: past ? .28 : 1,
      }, svg);
      if (live) path.setAttribute("filter", "url(#glow)");
      var tt = el("title", {}, path); tt.textContent = hm(s) + " " + e.title;
    });

    // Pakistan's "now", as a hollow green marker on the outer ring
    var pkz = zoned(PK_TZ, now), pkH = pkz.h + pkz.m / 60, pkp = pt(R_TICK + 6, pkH), pkl = pt(R_TICK + 40, pkH);
    el("circle", { cx: pkp[0], cy: pkp[1], r: 9, fill: "#060a18", stroke: "#3dd68c", "stroke-width": 3 }, svg);
    var pkt = el("text", { x: pkl[0], y: pkl[1] + 4, "text-anchor": "middle", fill: "#3dd68c", style: "fill:#3dd68c" }, svg); pkt.textContent = "PK";

    // now hand
    var inner = pt(R_ARC - 60, nowH), outer = pt(R_TICK + 6, nowH);
    el("line", { x1: inner[0], y1: inner[1], x2: outer[0], y2: outer[1], stroke: "rgba(255,255,255,.85)", "stroke-width": 2, "stroke-linecap": "round" }, svg);
    var dot = pt(R_ARC, nowH);
    el("circle", { cx: dot[0], cy: dot[1], r: 22, fill: "rgba(255,255,255,.12)" }, svg);
    el("circle", { cx: dot[0], cy: dot[1], r: 9, fill: "#fff", class: "nowDot" }, svg);
  }

  function renderNext() {
    var box = document.getElementById("next");
    clear(box);
    if (!data) return;
    if (!data.calendar.ok) { emptyMsg(box, "Calendar", data.calendar.reason); return; }
    var now = Date.now();
    var upcoming = data.calendar.events.filter(function (e) { return !e.allDay && Date.parse(e.end) > now; });
    var key = dayKey(new Date());
    var today = upcoming.filter(function (e) { return dayKey(new Date(e.start)) === key; });
    var e = today[0];
    if (!e) {
      box.appendChild(h("div", "eyebrow", "Rest of today"));
      box.appendChild(h("div", "next-title", "Nothing else in the diary"));
      var left = todaysEvents().length;
      box.appendChild(h("div", "next-meta")).appendChild(h("span", "chip ok", left ? left + " meeting" + (left > 1 ? "s" : "") + " done" : "Clear day"));
      return;
    }
    var s = Date.parse(e.start), live = s <= now;
    box.appendChild(h("div", "eyebrow", live ? "Now" : "Next · " + hm(new Date(s))));
    box.appendChild(h("div", "next-title private", e.title));
    var meta = h("div", "next-meta");
    meta.appendChild(h("span", live ? "chip live" : (s - now < 15 * 60000 ? "chip hot" : "chip"), live ? "ends in " + relMins(Date.parse(e.end) - now) : "in " + relMins(s - now)));
    if (e.external) meta.appendChild(h("span", "chip", "External"));
    if (e.people > 1) meta.appendChild(h("span", "chip", e.people + " people"));
    if (e.meet) meta.appendChild(h("span", "chip", "Meet"));
    box.appendChild(meta);
    var after = today.length - 1;
    if (after > 0) box.appendChild(h("div", "eyebrow", "+" + after + " more today")).style.marginTop = "12px";
  }

  function renderWeek() {
    var box = document.getElementById("week");
    clear(box);
    if (!data) return;
    var c = data.commitments, cal = data.calendar;
    if (!c.ok && !cal.ok) { emptyMsg(box, "Foundry", c.reason); return; }
    var start = new Date(); start.setHours(0, 0, 0, 0);
    var grid = h("div", "week");
    var total = 0, rec = 0;
    var maxTasks = innerHeight < 1000 ? 2 : 3;
    for (var i = 0; i < 7; i++) {
      var day = new Date(start.getTime()); day.setDate(start.getDate() + i);
      var key = dayKey(day);
      var col = h("div", "wd" + (i === 0 ? " today" : ""));
      var dn = h("div", "dn");
      dn.appendChild(h("span", null, i === 0 ? "Today" : day.toLocaleDateString("en-GB", { weekday: "short" })));
      dn.appendChild(h("span", null, String(day.getDate())));
      col.appendChild(dn);
      var mt = h("div", "mt");
      if (cal.ok) cal.events.filter(function (e) { return !e.allDay && dayKey(new Date(e.start)) === key; }).slice(0, 8).forEach(function (e) { mt.appendChild(h("i", e.external ? "ext" : "")); });
      col.appendChild(mt);
      var tasks = c.ok ? (c.week || []).filter(function (t) { return t.late ? i === 0 : dayKey(new Date(t.at)) === key; }) : [];
      total += tasks.length; rec += tasks.filter(function (t) { return t.recurring; }).length;
      tasks.slice(0, maxTasks).forEach(function (t) {
        var el2 = h("div", "task private" + (t.recurring ? " rec" : "") + (t.late ? " late" : ""), t.title);
        el2.title = t.title + (t.counterpart ? " · " + t.counterpart : "") + (t.rule ? " · repeats " + t.rule : "");
        col.appendChild(el2);
      });
      if (tasks.length > maxTasks) col.appendChild(h("div", "more", "+" + (tasks.length - maxTasks)));
      grid.appendChild(col);
    }
    document.getElementById("weekState").textContent = c.ok ? total + " tasks · " + rec + " repeating" : "";
    box.appendChild(grid);
    if (c.ok && !total) box.appendChild(h("div", "note", "No dated tasks this week. Add repeating ones in Foundry → Backstage → Commitments."));
    if (!c.ok) box.appendChild(h("div", "note", reasonText("Foundry", c.reason).text));
  }

  // ---------- inbox: Gmail + Slack ----------
  function draftRefs() {
    var map = {};
    if (data && data.drafts && data.drafts.ok) (data.drafts.items || []).forEach(function (d) { if (d.ref && d.state !== "rejected") map[d.ref] = d.state; });
    return map;
  }
  var TAG = { pending: "Reply ready", accepted: "Accepted", placed: "Draft saved", failed: "Draft failed" };
  function countBlock(n, label) {
    var b = h("div", "big", n == null ? "–" : String(n)); b.appendChild(h("small", null, label)); return b;
  }
  function renderMail() {
    var box = document.getElementById("mail");
    clear(box);
    if (!data) return;
    var m = data.mail, sl = data.slack || { ok: false, reason: "not_connected_slack" }, drafted = draftRefs();
    document.getElementById("mailState").textContent = m.ok ? m.unread + " unread in inbox" : "";
    var top = h("div", "inbox-top");
    var counts = h("div", "counts");
    counts.appendChild(countBlock(m.ok ? m.primaryUnread : null, "Primary"));
    counts.appendChild(countBlock(sl.ok ? sl.mentions + sl.dms : null, "Slack · " + (sl.days || 3) + "d"));
    top.appendChild(counts);
    var bars = h("div", "bars");
    top.appendChild(bars);
    box.appendChild(top);

    var rows = [];
    if (m.ok) m.messages.forEach(function (x) { rows.push({ src: "mail", who: x.from, key: x.domain || x.from, sub: x.subject, at: x.at, ref: x.threadId }); });
    if (sl.ok) sl.items.forEach(function (x) { rows.push({ src: "slack", who: x.from, key: x.fromId || x.from, sub: (x.channel ? "#" + x.channel + " · " : "") + x.text, at: x.at, ref: x.id, tag: x.kind === "dm" ? "DM" : x.channel ? "#" + x.channel : "Mention" }); });
    rows.sort(function (a, b) { return Date.parse(b.at) - Date.parse(a.at); });

    rows.slice(0, 12).reverse().forEach(function (x) {
      var age = (Date.now() - Date.parse(x.at)) / 3600000;
      var bar = h("span"); bar.style.height = Math.max(8, 44 - Math.min(age, 48) * .75) + "px";
      bar.style.background = x.src === "slack" ? "linear-gradient(180deg,#e8a8ff,#a855f7)" : "hsl(" + hue(x.key) + " 80% 66%)";
      bars.appendChild(bar);
    });

    rows.slice(0, innerHeight < 860 ? 3 : innerHeight < 1000 ? 4 : 5).forEach(function (x) {
      var row = h("div", "row");
      var av = h("div", "avatar", (x.who || "?").trim().charAt(0).toUpperCase());
      var hu = hue(x.key);
      av.style.background = "linear-gradient(135deg, hsl(" + hu + " 85% 72%), hsl(" + ((hu + 40) % 360) + " 80% 60%))";
      row.appendChild(av);
      var tx = h("div", "row-text");
      var t = h("div", "row-top");
      var name = h("span", "name");
      name.appendChild(h("span", "trunc private", x.who));
      name.appendChild(h("span", "src" + (x.src === "slack" ? " slack" : ""), x.src === "slack" ? "Slack" : "Mail"));
      if (x.ref && drafted[x.ref]) name.appendChild(h("span", "src draft", TAG[drafted[x.ref]] || "Reply ready"));
      t.appendChild(name);
      t.appendChild(h("span", "when", ago(x.at)));
      tx.appendChild(t);
      tx.appendChild(h("div", "row-sub private", x.src === "slack" ? x.sub : x.sub));
      row.appendChild(tx);
      box.appendChild(row);
    });
    if (!rows.length && m.ok && sl.ok) box.appendChild(h("div", "empty", "Nothing waiting. Primary and Slack are clear."));

    // Say plainly which source couldn't be read, instead of reading as "nothing there".
    [[m, "Gmail"], [sl, "Slack"]].forEach(function (pair) {
      if (pair[0].ok) return;
      var info = reasonText(pair[1], pair[0].reason);
      var n = h("div", "note", info.text);
      if (info.link) { var a = h("a", null, info.linkText); a.href = info.link; n.appendChild(a); }
      box.appendChild(n);
    });
  }

  // ---------- drafted by Claude ----------
  // Local decisions win until the server has caught up (its storage can lag by a minute).
  var decided = {};
  function decide(id, action, btns) {
    btns.forEach(function (b) { b.disabled = true; });
    fetch("/api/drafts/decide?k=" + encodeURIComponent(KEY), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: id, action: action }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok && r.status !== 409) throw new Error(j.message || r.status); return j; }); })
      .then(function () { decided[id] = action === "accept" ? "accepted" : "rejected"; renderDrafts(); renderMail(); })
      .catch(function () { btns.forEach(function (b) { b.disabled = false; }); });
  }
  function renderDrafts() {
    var box = document.getElementById("drafts");
    clear(box);
    if (!data) return;
    var d = data.drafts;
    var st = document.getElementById("draftState");
    if (!d || !d.ok) { st.textContent = ""; box.appendChild(h("div", "empty", "The drafter on your Mac hasn't run yet.")); return; }
    var items = (d.items || []).map(function (x) { return decided[x.id] ? Object.assign({}, x, { state: decided[x.id] }) : x; });
    var pending = items.filter(function (x) { return x.state === "pending"; });
    var waiting = items.filter(function (x) { return x.state === "accepted"; }).length;
    var mins = d.generatedAt ? Math.round((Date.now() - Date.parse(d.generatedAt)) / 60000) : null;
    var ran = mins == null ? "" : "Checked " + (mins < 60 ? mins + "m" : Math.round(mins / 60) + "h") + " ago";
    var top = h("div", "inbox-top");
    top.appendChild(countBlock(pending.length, "to review"));
    top.style.marginBottom = "4px";
    box.appendChild(top);
    var link = h("a", "review-link", "Read, edit or decide all ↗"); link.href = "/review?k=" + encodeURIComponent(KEY); link.target = "_blank"; link.rel = "noopener";
    st.textContent = "";
    box.appendChild(h("div", "note", (waiting ? waiting + " accepted · saving as draft" + (waiting > 1 ? "s" : "") + " within 5 min · " : "") + ran));
    if (!pending.length) { box.appendChild(h("div", "empty", "Nothing waiting on you.")); box.appendChild(link); return; }
    var order = { high: 0, normal: 1, low: 2 };
    pending.sort(function (a, b) { return order[a.urgency] - order[b.urgency]; }).slice(0, innerHeight < 900 ? 1 : innerHeight < 1100 ? 2 : 3).forEach(function (x) {
      var row = h("div", "sugg");
      var tx = h("div", "row-text");
      tx.appendChild(h("div", "t private", x.to + ": " + x.about));
      tx.appendChild(h("div", "m", (x.source === "slack" ? "Slack" : "Gmail") + (x.client ? " · " + x.client : "")));
      row.appendChild(tx);
      var acts = h("div", "acts");
      var yes = h("button", "btn yes", "Accept"), no = h("button", "btn no", "Reject");
      yes.type = no.type = "button";
      yes.addEventListener("click", function () { decide(x.id, "accept", [yes, no]); });
      no.addEventListener("click", function () { decide(x.id, "reject", [yes, no]); });
      acts.appendChild(yes); acts.appendChild(no);
      row.appendChild(acts);
      box.appendChild(row);
    });
    link.style.display = "inline-block"; link.style.marginTop = "6px";
    box.appendChild(link);
  }

  // ---------- promised ----------
  function renderPromised() {
    var box = document.getElementById("promised");
    clear(box);
    if (!data) return;
    var c = data.commitments;
    if (!c.ok) { emptyMsg(box, "Commitments", c.reason); return; }
    document.getElementById("promState").textContent = c.overdue ? c.overdue + " late" : "";
    var big = h("div", "big", String(c.open)); big.appendChild(h("small", null, c.suggested ? c.suggested + " to review" : "open"));
    big.style.marginBottom = "8px";
    box.appendChild(big);
    if (!c.items.length) { box.appendChild(h("div", "empty", "Nothing promised. Enjoy it.")); return; }
    var todayKey = dayKey(new Date());
    c.items.slice(0, innerHeight < 900 ? 1 : innerHeight < 1000 ? 2 : 3).forEach(function (it) {
      var row = h("div", "promise");
      var due = it.dueAt ? new Date(it.dueAt) : null;
      var overdue = due && due.getTime() < Date.now(), today = due && dayKey(due) === todayKey;
      row.appendChild(h("span", "ring" + (overdue ? " overdue" : today ? " today" : "")));
      var tx = h("div", "row-text");
      tx.appendChild(h("div", "t private", it.title));
      var meta = due ? (overdue ? "Late · " : today ? "Today · " : "") + due.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "No date";
      if (it.counterpart) meta += " · " + it.counterpart;
      tx.appendChild(h("div", "m" + (overdue ? " overdue" : ""), meta));
      row.appendChild(tx);
      box.appendChild(row);
    });
  }

  // ---------- systems ----------
  function renderSystems() {
    var box = document.getElementById("systems");
    clear(box);
    if (!data) return;
    var s = data.monitors;
    if (!s.ok) { emptyMsg(box, "Monitors", s.reason); return; }
    document.getElementById("sysState").textContent = s.up + "/" + s.total;
    var wrap = h("div", "systems");
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("class", "constellation");
    var n = s.dots.length || 1;
    var colours = { up: "#3dd68c", down: "#ff5b5b", flaky: "#f5b14c", slow: "#f5b14c", stale: "rgba(233,236,248,.3)", unknown: "rgba(233,236,248,.3)" };
    // golden-angle spiral so any number of services packs evenly
    s.dots.forEach(function (st, i) {
      var r = 44 * Math.sqrt((i + .5) / n), a = i * 2.39996;
      var cx = 50 + r * Math.cos(a), cy = 50 + r * Math.sin(a);
      if (st === "down") el("circle", { cx: cx, cy: cy, r: 9, fill: "rgba(255,91,91,.25)" }, svg);
      el("circle", { cx: cx, cy: cy, r: n > 30 ? 2.6 : 3.6, fill: colours[st] || colours.unknown }, svg);
    });
    var top = h("div", "sys-top");
    top.appendChild(svg);
    var tx = h("div");
    var head = s.down.length ? s.down.length + " down" : s.trouble.length ? s.trouble.length + " need a look" : "All operational";
    tx.appendChild(h("div", "sys-head", head));
    top.appendChild(tx);
    wrap.appendChild(top);
    var sub = s.down.length ? s.down.slice(0, 2).map(function (d) { return d.client + " · " + d.name; }).join(", ")
      : s.trouble.length ? s.trouble.slice(0, 2).map(function (d) { return d.client + " · " + d.name; }).join(", ")
      : s.total + " production services";
    wrap.appendChild(h("div", "sys-sub", sub));
    box.appendChild(wrap);
  }

  function renderFoot() {
    var f = document.getElementById("fresh");
    if (!data) { f.textContent = ""; return; }
    var mins = Math.round((Date.now() - Date.parse(data.readAt)) / 60000);
    f.textContent = mins >= 10 ? "Stale · last read " + mins + " min ago" : "Live";
    f.className = mins >= 10 ? "warn" : "";
  }

  function renderAll() {
    renderClock(); renderDial(); renderNext(); renderMail(); renderDrafts(); renderPromised(); renderSystems(); renderWeek(); renderFoot();
  }

  function load() {
    fetch("/api/data?k=" + encodeURIComponent(KEY), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { data = d; renderAll(); })
      .catch(function () { renderFoot(); }); // keep showing the last good read; the footer says how old it is
  }

  renderAll();
  load();
  setInterval(load, 60000);
  setInterval(function () { renderClock(); renderDial(); renderNext(); renderFoot(); }, 20000);
  // If the Mac slept, catch up straight away.
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
})();
</script>
