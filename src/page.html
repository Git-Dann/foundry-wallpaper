<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Foundry Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #e9ecf8;
  --ink-2: rgba(233, 236, 248, .72);
  --ink-3: rgba(233, 236, 248, .46);
  --ink-4: rgba(233, 236, 248, .22);
  --line: rgba(233, 236, 248, .10);
  --ground: #060a18;
  --blue: #3b82f6;
  --blue-deep: #1d4ed8;
  --indigo: #6366f1;
  --violet: #8b5cf6;
  --amber: #f5b14c;
  --coral: #ff7a6b;
  --green: #3dd68c;
  --glass: rgba(14, 20, 42, .42);
  --serif: "DM Serif Display", Georgia, serif;
  --sans: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  /* keep clear of the menu bar and the Dock */
  --safe-top: max(56px, 6vh);
  --safe-bottom: max(96px, 11vh);
  --safe-side: max(48px, 4vw);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  cursor: default;
  user-select: none;
}

/* ---------- the sky ---------- */
.sky { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
.blob {
  position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; mix-blend-mode: screen;
  will-change: transform;
}
.b1 { width: 62vmax; height: 62vmax; left: -18vmax; top: -22vmax; background: radial-gradient(circle at 40% 40%, var(--blue-deep), transparent 65%); animation: drift1 95s ease-in-out infinite alternate; }
.b2 { width: 54vmax; height: 54vmax; right: -16vmax; top: 8vmax; background: radial-gradient(circle at 50% 50%, var(--indigo), transparent 62%); animation: drift2 120s ease-in-out infinite alternate; opacity: .45; }
.b3 { width: 48vmax; height: 48vmax; left: 22vmax; bottom: -26vmax; background: radial-gradient(circle at 50% 50%, var(--violet), transparent 60%); animation: drift3 140s ease-in-out infinite alternate; opacity: .35; }
.b4 { width: 30vmax; height: 30vmax; right: 18vmax; bottom: -8vmax; background: radial-gradient(circle, #0ea5e9, transparent 60%); animation: drift1 160s ease-in-out infinite alternate-reverse; opacity: .22; }
@keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.12); } }
@keyframes drift2 { to { transform: translate(-12vmax, 12vmax) scale(.9); } }
@keyframes drift3 { to { transform: translate(-16vmax, -10vmax) scale(1.15); } }
.grid {
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(233,236,248,.09) 1px, transparent 1.2px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at 38% 50%, #000 0%, transparent 72%);
}
.grain {
  position: absolute; inset: -50%; opacity: .07; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(3,5,12,.7) 100%); }

/* ---------- layout ---------- */
.stage {
  position: relative; z-index: 1; height: 100%;
  padding: var(--safe-top) var(--safe-side) var(--safe-bottom);
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr);
  grid-template-rows: minmax(0, 1fr);
  gap: clamp(32px, 5vw, 96px);
  align-items: center;
}
@media (max-aspect-ratio: 1/1) {
  .stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: start; }
}

/* ---------- the dial ---------- */
.dialWrap { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.4vh, 28px); height: 100%; min-height: 0; }
.dialBox { container-type: inline-size; position: relative; width: min(100%, 980px, calc((100vh - var(--safe-top) - var(--safe-bottom) - clamp(160px, 19vh, 230px)) * .86)); aspect-ratio: 1; flex: none; }
.dial { width: 100%; height: 100%; overflow: visible; display: block; }
.weekCard { width: min(100%, 900px); flex: none; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin-top: calc(-1 * clamp(4px, 1vh, 12px)); font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 16px; height: 6px; border-radius: 3px; }
.legend .k-int { background: linear-gradient(90deg, #60a5fa, #6366f1); }
.legend .k-ext { background: linear-gradient(90deg, #fbbf24, #ff7a6b); }
.legend .k-work { background: rgba(233,236,248,.22); }
.legend .k-now { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #070b18, 0 0 0 3px rgba(255,255,255,.5); }
.legend .k-pk { width: 8px; height: 8px; border-radius: 50%; border: 2px solid #3dd68c; }
.legend .k-pkw { width: 16px; height: 3px; border-radius: 2px; background: rgba(61,214,140,.55); }
.free { font-family: var(--mono); font-size: max(10px, 1.35cqw); letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin-top: 10px; }
.tmrw { font-size: max(11.5px, 1.9cqw); color: var(--ink-2); margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wd.past { opacity: .45; }
.week { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.add-link { color: var(--ink-2); text-decoration: none; }
.dial text { font-family: var(--mono); fill: var(--ink-3); font-size: 11px; letter-spacing: .14em; }
.centre {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none;
}
.centre-inner { width: 56%; }
.eyebrow { font-family: var(--mono); font-size: max(9.5px, 1.45cqw); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3); }
.day { font-family: var(--serif); font-size: 19cqw; line-height: .82; letter-spacing: -.02em; margin-top: .1em;
  background: linear-gradient(180deg, #fff 30%, rgba(190,205,255,.75)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.month { font-family: var(--serif); font-style: italic; font-size: 4.6cqw; color: var(--ink-2); margin-top: .1em; }
.clocks { display: flex; justify-content: center; gap: 5cqw; margin-top: 2.4cqw; }
.clk { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.clk .lbl { font-family: var(--mono); font-size: clamp(10px, .75vw, 12px); letter-spacing: .2em; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.clk .lbl i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.clk .val { font-family: var(--mono); font-weight: 500; font-size: 5.4cqw; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clk.pk .val { color: var(--ink-2); }
.clk .colon { opacity: .5; animation: blink 2s steps(1) infinite; }
.clk .off { font-family: var(--mono); font-size: max(10px, 1.25cqw); letter-spacing: .12em; color: var(--ink-3); white-space: nowrap; }
.clk .off.on { color: var(--green); }
@keyframes blink { 50% { opacity: .15; } }
.next { margin-top: 3.4cqw; padding-top: 2.6cqw; border-top: 1px solid var(--line); }
.next-title { font-size: max(13px, 2.6cqw); font-weight: 500; margin-top: 8px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.next-meta { margin-top: 10px; display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.chip {
  font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 6px; border: 1px solid var(--ink-4); color: var(--ink-2);
}
.chip.hot { border-color: rgba(245,177,76,.55); color: var(--amber); background: rgba(245,177,76,.08); }
.chip.live { border-color: rgba(255,122,107,.6); color: var(--coral); background: rgba(255,122,107,.1); }
.chip.ok { border-color: rgba(61,214,140,.5); color: var(--green); background: rgba(61,214,140,.08); }

.arc { transition: opacity .6s; }

/* ---------- side instruments ---------- */
.side { display: flex; flex-direction: column; gap: clamp(12px, 1.8vh, 22px); min-width: 0; max-height: 100%; overflow: hidden; }
.card {
  position: relative; border-radius: 16px; overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015)), var(--glass);
  border: 1px solid rgba(233,236,248,.09);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 30px 80px -40px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);
}
.card-head {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; white-space: nowrap;
  height: 36px; padding: 0 16px; border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3);
}
.card-body { padding: 16px; }
.card-head span:first-child { flex: none; }
.card-head span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 2000px) { .side, .weekCard, .legend { zoom: 1.25; } }
@media (min-width: 2800px) { .side { zoom: 1.5; } }
.big { font-family: var(--serif); font-size: clamp(44px, 6.4vh, 84px); line-height: .9; }
.big small { font-family: var(--sans); font-size: 13px; color: var(--ink-3); margin-left: 8px; letter-spacing: 0; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 7px 0; }
.row + .row { border-top: 1px solid rgba(233,236,248,.05); }
.avatar {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 600; color: #0b1020;
}
.row-text { min-width: 0; flex: 1; }
.row-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 500; }
.row-top .when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 400; flex: none; }
.row-sub { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.discreet .private { filter: blur(6px); }

.inbox-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 44px; }
.counts { display: flex; gap: clamp(18px, 2vw, 32px); align-items: flex-end; }
.src { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--ink-4); border-radius: 4px; padding: 1px 5px; flex: none; }
.src.slack { color: #e8a8ff; border-color: rgba(232,168,255,.35); }
.src.ask { color: #fcd34d; border-color: rgba(252,211,77,.4); }
.promise .m .src { font-size: 9px; padding: 0 4px; margin-right: 2px; }
.row-top .name { display: flex; gap: 7px; align-items: center; min-width: 0; }
.note { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; }
.note a { color: var(--ink-2); }
.bars span { width: 6px; border-radius: 3px; background: linear-gradient(180deg, var(--blue), var(--indigo)); opacity: .85; }

.promise { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.promise + .promise { border-top: 1px solid rgba(233,236,248,.05); }
.ring { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink-3); margin-top: 3px; }
.ring.overdue { border-color: var(--coral); box-shadow: 0 0 10px rgba(255,122,107,.6); }
.ring.today { border-color: var(--amber); }
.promise .t { font-size: 13.5px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.promise .m { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 3px; }
.promise .m.overdue { color: var(--coral); }

.systems { display: flex; gap: 16px; align-items: center; }
.sys-top { display: flex; gap: 14px; align-items: center; flex: none; }
.constellation { flex: none; width: 52px; height: 52px; }
.systems .sys-sub { margin-top: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-body.slim { padding: 12px 16px; }
.side > * { flex-shrink: 0; }
@media (max-width: 1440px) { .card-head { letter-spacing: .12em; padding: 0 12px; } .card-body { padding: 12px; } }
@media (max-height: 860px) { .big { font-size: 40px; } .inbox-top { margin-bottom: 4px; } .bars { height: 30px; } .row { padding: 5px 0; } .promise { padding: 6px 0; } }
.sys-head { font-family: var(--serif); font-size: clamp(19px, 2.3vh, 26px); line-height: 1.1; white-space: nowrap; }
.sys-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.45; }
.mon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 12px; }
.mon { min-width: 0; border-radius: 8px; padding: 6px 9px; background: rgba(255,255,255,.03); border: 1px solid rgba(233,236,248,.06); }
.mon.bad { background: rgba(255,91,91,.08); border-color: rgba(255,91,91,.35); }
.mon.warn { background: rgba(245,177,76,.07); border-color: rgba(245,177,76,.3); }
.mon-top { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; }
.mon-top .nm { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon-top .n { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); flex: none; }
.mon-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.mon-sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 2px; padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon.bad .mon-sub { color: #ff9a8d; }
.mon.warn .mon-sub { color: var(--amber); }
.mon-more { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); display: flex; align-items: center; padding-left: 4px; }

.strip-labels { position: relative; height: 14px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.strip-labels span { position: absolute; transform: translateX(-50%); }
.strip-labels span:first-child { transform: none; }
.week { display: grid; gap: 6px; }
.wd { min-width: 0; border-radius: 8px; padding: 6px 6px 8px; background: rgba(255,255,255,.025); border: 1px solid rgba(233,236,248,.05); display: flex; flex-direction: column; gap: 4px; }
.wd.today { background: rgba(59,130,246,.12); border-color: rgba(96,165,250,.35); }
.wd .dn { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; gap: 4px; }
.wd.today .dn { color: var(--ink); }
.wd .mt { display: flex; gap: 2px; height: 4px; }
.wd .mt i { flex: 1; border-radius: 2px; background: #60a5fa; opacity: .7; }
.wd .mt i.ext { background: #f5b14c; }
.task { font-size: 11px; line-height: 1.3; padding: 3px 5px; border-radius: 4px; background: rgba(139,92,246,.16); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task.rec::before { content: "↻ "; color: #c4b5fd; }
.task.late { background: rgba(255,122,107,.16); color: #ffb3aa; }
.more { font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.use { display: grid; gap: 8px; }
.use-tool { display: grid; gap: 4px; }
.use-name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 600; }
.use-name .asof { font-family: var(--mono); font-size: 10px; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.use-name .asof.old { color: var(--amber); }
.use-win { display: grid; grid-template-columns: 30px minmax(0, 1fr) 36px 58px; gap: 8px; align-items: center; }
.use-win .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.use-win .pct { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--ink); }
.use-bar { height: 6px; border-radius: 3px; background: rgba(233,236,248,.08); overflow: hidden; }
.use-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--blue), var(--indigo)); }
.use-bar i.warm { background: linear-gradient(90deg, #f5b14c, #f59e0b); }
.use-bar i.hot { background: linear-gradient(90deg, #ff9a8d, var(--coral)); }
.use-reset { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--ink-3); text-align: right; white-space: nowrap; }
.use-tool + .use-tool { border-top: 1px solid rgba(233,236,248,.05); padding-top: 8px; }
.empty { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.empty a { color: var(--ink); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 2.2vh, 26px); }
@media (max-height: 1050px) { .hide-short { display: none; } }

.foot {
  position: fixed; z-index: 1; left: var(--safe-side); bottom: calc(var(--safe-bottom) - 40px);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-4);
  display: flex; gap: 14px;
}
.foot .warn { color: var(--amber); }

@media (prefers-reduced-motion: reduce) {
  .blob, .clk .colon { animation: none !important; }
}
.still .blob, .still .clk .colon { animation: none !important; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="grid"></div><div class="grain"></div><div class="vignette"></div>
</div>

<main class="stage">
  <section class="dialWrap">
    <div class="dialBox">
    <svg class="dial" id="dial" viewBox="0 0 1000 1000" aria-label="Today"></svg>
    <div class="centre">
      <div class="centre-inner">
        <div class="eyebrow" id="weekday">—</div>
        <div class="day" id="day">—</div>
        <div class="month" id="month">—</div>
        <div class="clocks" id="clocks"></div>
        <div class="next" id="next"></div>
      </div>
    </div>
    </div>
    <div class="legend" aria-hidden="true">
      <span><i class="k-int"></i>Gitwork meeting</span>
      <span><i class="k-ext"></i>Client meeting</span>
      <span><i class="k-work"></i>Working hours</span>
      <span><i class="k-now"></i>Now</span>
      <span><i class="k-pk"></i>Pakistan now</span>
      <span><i class="k-pkw"></i>Pakistan hours</span>
    </div>
    <div class="card weekCard">
      <div class="card-head"><span>05 // This week</span><span id="weekState"></span></div>
      <div class="card-body slim" id="week"><div class="empty">—</div></div>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="card-head"><span>01 // Inbox</span><span id="mailState"></span></div>
      <div class="card-body" id="mail"><div class="empty">Reading Gmail and Slack…</div></div>
    </div>
    <div class="split">
      <div class="card">
        <div class="card-head"><span>02 // On you</span><span id="promState"></span></div>
        <div class="card-body" id="promised"><div class="empty">Reading Foundry…</div></div>
      </div>
      <div class="card">
        <div class="card-head"><span>03 // Claude · Codex</span><span id="useState"></span></div>
        <div class="card-body" id="usage"><div class="empty">—</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span>04 // Systems</span><span id="sysState"></span></div>
      <div class="card-body slim" id="systems"><div class="empty">Reading Foundry…</div></div>
    </div>
  </aside>
</main>

<div class="foot" aria-hidden="true"><span>Foundry · Gitwork</span><span id="fresh"></span></div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var KEY = params.get("k") || "";
  if (params.get("discreet") === "1") document.body.classList.add("discreet");
  if (params.get("still") === "1") document.body.classList.add("still");

  var NS = "http://www.w3.org/2000/svg";
  var C = 500, R_TICK = 452, R_ARC = 404, R_ARC_W = 34, R_NIGHT = 452;
  var data = null;

  // ---------- helpers ----------
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function h(tag, cls, text) {

    var row = h("div", "use-win");
    row.appendChild(h("span", "lbl", label));
    var bar = h("div", "use-bar"), fill = h("i");
    var pct = w ? Math.min(100, w.pct) : 0;
    // A window whose reset time has passed is back to zero, whatever the last reading said.
    if (w && w.resetsAt && w.resetsAt * 1000 < Date.now()) pct = 0;
    fill.style.width = pct + "%";
    if (pct >= 90) fill.className = "hot"; else if (pct >= 70) fill.className = "warm";
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(h("span", "pct", w ? Math.round(pct) + "%" : "–"));
    var rs = h("span", "use-reset", w && w.resetsAt ? untilText(w.resetsAt) : ""); rs.title = "Resets"; row.appendChild(rs);
    return row;
  }
  function renderUsage() {
    var box = document.getElementById("usage");
    clear(box);
    if (!data) return;
    var u = data.usage;
    document.getElementById("useState").textContent = "";
    if (!u || !u.ok) { box.appendChild(h("div", "empty", "Waiting for your Mac. Run ./local/draft-replies.sh --install, then use Claude Code once.")); return; }
    var wrap = h("div", "use");
    [["Claude", u.claude, "Use Claude Code once to send it."], ["Codex", u.codex, "Use Codex once to send it."]].forEach(function (t) {
      var tool = h("div", "use-tool");
      var name = h("div", "use-name");
      name.appendChild(h("span", null, t[0]));
      var x = t[1];
      if (x && x.at) {
        var mins = Math.round((Date.now() - x.at * 1000) / 60000);
        name.appendChild(h("span", "asof" + (mins > 360 ? " old" : ""), "as of " + (mins < 1 ? "now" : mins < 60 ? mins + "m ago" : mins < 48 * 60 ? Math.round(mins / 60) + "h ago" : Math.round(mins / 1440) + "d ago")));
      }
      tool.appendChild(name);
      if (!x) { tool.appendChild(h("div", "note", "No reading yet. " + t[2])); wrap.appendChild(tool); return; }
      tool.appendChild(useWindow("5h", x.fiveHour));
      tool.appendChild(useWindow("Wk", x.week));
      wrap.appendChild(tool);
    });
    box.appendChild(wrap);
  }

  // ---------- on you: asked of you + promised by you ----------
  // One list, soonest deadline first. Asks come from Slack, Gmail and meeting notes (with the
  // asker's own words behind them); promises are open Foundry commitments.
  function onYouItems() {
    var out = [];
    var a = data.asks, c = data.commitments;
    if (a && a.ok) (a.items || []).filter(function (x) { return x.state === "open"; }).forEach(function (x) {
      out.push({ kind: "ask", title: x.what, who: x.from, src: x.source, due: x.due ? new Date(x.due + "T17:00:00") : null, dueText: x.dueText, client: x.client });
    });
    if (c && c.ok) (c.items || []).forEach(function (x) {
      out.push({ kind: "promise", title: x.title, who: x.counterpart, src: "promise", due: x.dueAt ? new Date(x.dueAt) : null, recurring: x.recurring });
    });
    out.sort(function (p, q) { return (p.due ? p.due.getTime() : Infinity) - (q.due ? q.due.getTime() : Infinity) || (p.kind === "ask" ? -1 : 1); });
    return out;
  }
  var SRC = { slack: "Slack", gmail: "Email", meeting: "Meeting", promise: "Promised" };
  function renderPromised() {
    var box = document.getElementById("promised");
    clear(box);
    if (!data) return;
    var a = data.asks, c = data.commitments;
    if ((!a || !a.ok) && !c.ok) { emptyMsg(box, "Foundry", c.reason); return; }
    var items = onYouItems();
    var asks = items.filter(function (x) { return x.kind === "ask"; }).length, proms = items.length - asks;
    var late = items.filter(function (x) { return x.due && x.due.getTime() < Date.now(); }).length;
    var st = document.getElementById("promState"); clear(st);
    var all = h("a", "add-link", "All ↗"); all.href = "/asks?k=" + encodeURIComponent(KEY); all.target = "_blank"; all.rel = "noopener";
    st.appendChild(all);
    var top = h("div", "counts"); top.style.marginBottom = "6px";
    top.appendChild(countBlock(asks, "asked"));
    top.appendChild(countBlock(proms, "promised"));
    box.appendChild(top);
    if (late) { var ln = h("div", "note", late + " late"); ln.style.color = "var(--coral)"; ln.style.marginTop = "-2px"; box.appendChild(ln); }
    if (!items.length) { box.appendChild(h("div", "empty", "Nothing on you. Enjoy it.")); return; }
    var todayKey = dayKey(new Date());
    items.slice(0, 3).forEach(function (it) {
      var row = h("div", "promise");
      var overdue = it.due && it.due.getTime() < Date.now(), today = it.due && dayKey(it.due) === todayKey;
      row.appendChild(h("span", "ring" + (overdue ? " overdue" : today ? " today" : "")));
      var tx = h("div", "row-text");
      tx.appendChild(h("div", "t private", it.title));
      var when = it.due ? (overdue ? "Late · " : today ? "Today · " : "") + it.due.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : (it.dueText || "No date");
      var meta = h("div", "m" + (overdue ? " overdue" : ""));
      meta.appendChild(h("span", "src" + (it.kind === "ask" ? " ask" : ""), SRC[it.src]));
      meta.appendChild(document.createTextNode(" " + when + (it.who ? " · " + (it.kind === "ask" ? "from " : "") + it.who : "")));
      tx.appendChild(meta);
      row.appendChild(tx);
      box.appendChild(row);
    });
  }

  // ---------- systems: Foundry Monitors ----------
  // Production services only, grouped by client like the Monitors page in Foundry: anything with
  // a problem first (with the service named), then the rest with their slowest response time.
  var MON_COLOUR = { up: "#3dd68c", down: "#ff5b5b", flaky: "#f5b14c", slow: "#f5b14c", stale: "rgba(233,236,248,.35)", unknown: "rgba(233,236,248,.35)" };
  var MON_WORD = { down: "down", flaky: "unstable", slow: "slow", stale: "not checking", unknown: "no result yet" };
  function msText(ms) { return ms == null ? "" : ms >= 1000 ? (ms / 1000).toFixed(1) + "s" : ms + "ms"; }
  function renderSystems() {
    var box = document.getElementById("systems");
    clear(box);
    if (!data) return;
    var s = data.monitors;
    var st = document.getElementById("sysState"); clear(st);
    if (!s.ok) { emptyMsg(box, "Monitors", s.reason); return; }
    st.appendChild(document.createTextNode(s.up + "/" + s.total + " up "));
    if (s.link) { var all = h("a", "add-link", "· All ↗"); all.href = s.link; all.target = "_blank"; all.rel = "noopener"; st.appendChild(all); }

    var wrap = h("div", "systems");
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("class", "constellation");
    var n = s.dots.length || 1;
    s.dots.forEach(function (d, i) {
      var r = 44 * Math.sqrt((i + .5) / n), a = i * 2.39996;
      var cx = 50 + r * Math.cos(a), cy = 50 + r * Math.sin(a);
      if (d === "down") el("circle", { cx: cx, cy: cy, r: 9, fill: "rgba(255,91,91,.25)" }, svg);
      el("circle", { cx: cx, cy: cy, r: n > 30 ? 2.6 : 3.6, fill: MON_COLOUR[d] || MON_COLOUR.unknown }, svg);
    });
    var top = h("div", "sys-top");
    top.appendChild(svg);
    var head = s.down.length ? s.down.length + " down" : s.trouble.length ? s.trouble.length + " need a look" : "All operational";
    top.appendChild(h("div", "sys-head", head));
    wrap.appendChild(top);
    var open = (s.incidents || []).filter(function (i) { return !i.acknowledged; }).length;
    var sub = (s.groups || []).length + " clients · " + s.total + " services" + (open ? " · " + open + " incident" + (open > 1 ? "s" : "") + " not acknowledged" : "");
    wrap.appendChild(h("div", "sys-sub", sub));
    box.appendChild(wrap);

    var groups = s.groups || [];
    if (!groups.length) return;
    var max = 24;
    // Never hide a client with a problem to make room.
    var bad = groups.filter(function (g) { return g.worst !== "up"; }).length;
    var shown = groups.slice(0, Math.max(max, bad));
    var grid = h("div", "mon-grid");
    shown.forEach(function (g) {
      var cls = g.worst === "down" ? " bad" : g.worst === "up" ? "" : " warn";
      var t = h("div", "mon" + cls);
      var tp = h("div", "mon-top");
      var dot = h("span", "mon-dot"); dot.style.background = MON_COLOUR[g.worst] || MON_COLOUR.unknown; tp.appendChild(dot);
      tp.appendChild(h("span", "nm private", g.client));
      tp.appendChild(h("span", "n", g.up + "/" + g.total));
      t.appendChild(tp);
      var p = g.problems[0];
      var line = p ? p.name + " · " + (MON_WORD[p.state] || p.state) + (p.state === "down" && p.code ? " " + p.code : p.ms != null && p.state === "slow" ? " " + msText(p.ms) : "") + (g.problems.length > 1 ? " +" + (g.problems.length - 1) : "")
        : (g.ms != null ? "slowest " + msText(g.ms) : "up");
      var sl = h("div", "mon-sub private", line); sl.title = line; t.appendChild(sl);
      grid.appendChild(t);
    });
    box.appendChild(grid);
    grid.dataset.total = groups.length;
  }
  // Make the right-hand column fit the screen by measuring it, not guessing from the window
  // height. Trims in order of what matters least; a client with a problem is never trimmed.
  var FIT_STEPS = [["#mail .row", 3], ["#promised .promise", 2], ["#systems .mon:not(.bad):not(.warn)", 0], ["#mail .row", 2], ["#promised .promise", 1]];
  function fitSide() {
    var side = document.querySelector(".side");
    if (!side) return;
    var over = function () { return side.scrollHeight > side.clientHeight + 1; };
    FIT_STEPS.forEach(function (step) {
      var list = side.querySelectorAll(step[0]);
      for (var i = list.length - 1; i >= step[1] && over(); i--) list[i].remove();
    });
    var grid = side.querySelector(".mon-grid");
    if (grid) {
      var left = Number(grid.dataset.total || 0) - grid.querySelectorAll(".mon").length;
      if (left > 0) {
        var more = h("div", "mon-more", "+" + left + " more, all up");
        grid.appendChild(more);
        if (over()) { var ok = grid.querySelectorAll(".mon:not(.bad):not(.warn)"); if (ok.length) { ok[ok.length - 1].remove(); more.textContent = "+" + (left + 1) + " more, all up"; } }
      }
    }
  }
  window.addEventListener("resize", function () { if (data) renderAll(); });

  function renderFoot() {
    var f = document.getElementById("fresh");
    if (!data) { f.textContent = ""; return; }
    var mins = Math.round((Date.now() - Date.parse(data.readAt)) / 60000);
    f.textContent = mins >= 10 ? "Stale · last read " + mins + " min ago" : "Live";
    f.className = mins >= 10 ? "warn" : "";
  }

  function renderAll() {
    renderClock(); renderDial(); renderNext(); renderMail(); renderUsage(); renderPromised(); renderSystems(); renderWeek(); renderFoot();
    fitSide();
  }

  function load() {
    fetch("/api/data?k=" + encodeURIComponent(KEY), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { data = d; renderAll(); })
      .catch(function () { renderFoot(); }); // keep showing the last good read; the footer says how old it is
  }

  renderAll();
  load();
  setInterval(load, 60000);
  // Something added in the controller or ticked off on the asks page shows within ~15 seconds.
  var stamp = null;
  setInterval(function () {
    fetch("/api/stamp?k=" + encodeURIComponent(KEY), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      if (stamp !== null && j.stamp !== stamp) load();
      stamp = j.stamp;
    }).catch(function () {});
  }, 15000);
  setInterval(function () { renderClock(); renderDial(); renderNext(); renderFoot(); }, 20000);
  // If the Mac slept, catch up straight away.
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
