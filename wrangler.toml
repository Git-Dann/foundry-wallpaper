name = "foundry-wallpaper"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
FOUNDRY_URL = "https://foundry.gitwork.co.uk"

[[kv_namespaces]]
binding = "STORE"
