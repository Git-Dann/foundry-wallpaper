name = "foundry-wallpaper"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
FOUNDRY_URL = "https://foundry.gitwork.co.uk"

# No id on purpose: Wrangler creates the namespace on first deploy in whichever account deploys it,
# and keeps using it after that.
[[kv_namespaces]]
binding = "STORE"

# The wallpaper design is bundled into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false
